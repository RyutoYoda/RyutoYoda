name: 🌳 Update Contribution Tree

on:
  schedule:
    - cron: '0 0 * * *'   # daily at midnight UTC
  push:
    paths:
      - 'scripts/generate_tree.py'
      - 'scripts/fetch_contributions.py'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install Pillow

      - name: Fetch total contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMITS_FILE: /tmp/commits.txt
        run: python scripts/fetch_contributions.py

      - name: Generate Minecraft tree
        run: |
          COMMITS=$(cat /tmp/commits.txt)
          echo "Total contributions: $COMMITS"
          python scripts/generate_tree.py --commits "$COMMITS" --output contribution_tree.png

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add contribution_tree.png
          git diff --staged --quiet || git commit -m "🌳 Update Contribution Tree ($(cat /tmp/commits.txt) contributions)"
          git push
